<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generally Portfolio - Arcade Racing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        .font-pixel { font-family: 'Press Start 2P', monospace; }
        .font-crt { font-family: 'Share Tech Mono', monospace; }

        /* Canvas rendering performance optimization */
        canvas {
            image-rendering: optimizeSpeed;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
            will-change: transform;
        }

        /* Inline alignment for HUD icons and labels */
        .hud-item, .topbar-item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            line-height: 1;
        }

        .hud-item i, .hud-item svg,
        .topbar-item i, .topbar-item svg {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            font-size: 0.875rem;
            transform: translateY(-0.5px);
        }

        /* Retro Arcade & Neon Glow Visual Styling */
        .arcade-border {
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.4), inset 0 0 10px rgba(234, 179, 8, 0.2);
        }
        
        .neon-glow-yellow {
            text-shadow: 0 0 8px rgba(234, 179, 8, 0.8), 0 0 12px rgba(234, 179, 8, 0.4);
        }

        .neon-glow-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8), 0 0 12px rgba(6, 182, 212, 0.4);
        }

        /* Lightweight CRT Scanline Overlay Effect */
        body.crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 50;
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Custom Retro Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-950 text-white overflow-hidden select-none h-screen w-screen relative crt">

    <!-- TOPBAR NAVIGATION & HEADER -->
    <header class="absolute top-0 left-0 right-0 z-20 bg-gray-900/90 border-b-2 border-yellow-500/40 px-5 py-2.5 flex items-center justify-between shadow-xl backdrop-blur-md">
        
        <!-- Left: Logo & Zone Teleport Controls -->
        <div class="flex items-center space-x-6">
            <div class="topbar-item text-yellow-400 font-pixel text-xs tracking-wider neon-glow-yellow">
                <i class="fa-solid fa-flag-checkered text-sm"></i>
                <span>DEV CIRCUIT</span>
            </div>
            
            <nav class="flex items-center space-x-2 font-pixel text-[10px]">
                <button onclick="teleportToZone('about')" class="topbar-item bg-gray-800/80 hover:bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 px-3 py-1.5 rounded transition">
                    <i class="fa-solid fa-user"></i>
                    <span>ABOUT</span>
                </button>
                <button onclick="teleportToZone('projects')" class="topbar-item bg-gray-800/80 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 px-3 py-1.5 rounded transition">
                    <i class="fa-solid fa-code-branch"></i>
                    <span>PROJECTS</span>
                </button>
                <button onclick="teleportToZone('skills')" class="topbar-item bg-gray-800/80 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-3 py-1.5 rounded transition">
                    <i class="fa-solid fa-sliders"></i>
                    <span>SKILLS</span>
                </button>
                <button onclick="teleportToZone('contact')" class="topbar-item bg-gray-800/80 hover:bg-rose-500/20 text-rose-400 border border-rose-500/40 px-3 py-1.5 rounded transition">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>CONTACT</span>
                </button>
            </nav>
        </div>

        <!-- Right: Audio Synthesizer & CRT Visual Toggles -->
        <div class="flex items-center space-x-2">
            <button onclick="toggleSound()" title="Toggle Audio Synthesizer" class="topbar-item bg-gray-800 hover:bg-gray-700 p-2 rounded border border-gray-700 text-xs">
                <i id="soundIcon" class="fa-solid fa-volume-xmark text-gray-400"></i>
            </button>
            
            <button id="crtToggle" onclick="toggleCRT()" title="Toggle Retro CRT Filter" class="font-pixel text-[9px] bg-emerald-950/80 text-emerald-400 border border-emerald-500/60 px-2.5 py-1.5 rounded flex items-center space-x-1.5 transition">
                <span id="crtDot" class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
                <span id="crtText">CRT</span>
            </button>
        </div>
    </header>

    <!-- NOTIFIKASI REKOR BARU -->
    <div id="newRecordBanner" class="absolute top-1/4 left-1/2 -translate-x-1/2 z-30 hidden flex-col items-center justify-center bg-slate-900/90 border-2 border-yellow-400 text-yellow-400 px-6 py-3 rounded-lg shadow-[0_0_20px_rgba(250,204,21,0.5)] backdrop-blur-md transition-all duration-300 font-pixel pointer-events-none select-none">
        <div class="flex items-center space-x-3 text-sm md:text-base tracking-widest text-yellow-300">
            <i class="fa-solid fa-trophy text-yellow-400 animate-bounce"></i>
            <span>NEW RECORD</span>
            <i class="fa-solid fa-trophy text-yellow-400 animate-bounce"></i>
        </div>
        <div id="newRecordTime" class="text-xs md:text-sm text-white mt-1 tracking-wider">
            00:00.00
        </div>
    </div>

    <!-- HUD POJOK KIRI BAWAH -->
    <div id="hudContainer" class="absolute bottom-4 left-4 z-10 flex flex-col items-start space-y-2 pointer-events-none font-pixel select-none">
        
        <!-- Speedometer Jarum Classic -->
        <div class="relative w-36 h-20 bg-slate-900/80 border-2 border-slate-700 rounded-t-full p-2 flex justify-center items-end shadow-lg overflow-hidden backdrop-blur-sm">
            <canvas id="speedoCanvas" width="140" height="80" class="absolute bottom-0"></canvas>
            <div class="z-10 text-center mb-1">
                <span id="speedDisplay" class="text-xs text-amber-400 font-bold block tracking-widest">000</span>
                <span class="text-[8px] text-slate-400 block -mt-1">KM/H</span>
            </div>
        </div>

        <!-- Telemetri Lap, Checkpoint, dan Best Time -->
        <div class="bg-slate-900/80 border border-slate-700/80 rounded p-2 text-[10px] text-white space-y-1 shadow-md backdrop-blur-sm min-w-[180px]">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-stopwatch text-amber-400"></i>
                <span id="timerDisplay" class="font-bold text-white tracking-wider">00:00.00</span>
            </div>
            <div class="flex items-center space-x-2 text-emerald-400">
                <i class="fa-solid fa-trophy text-xs"></i>
                <span id="bestLapDisplay" class="font-semibold">BEST: --:--.--</span>
            </div>
            <div class="text-[9px] text-slate-300 pt-1 border-t border-slate-800">
                <span id="cpDisplay" class="block truncate">NEXT: START / FINISH</span>
            </div>
        </div>

    </div>

    <!-- HUD: CIRCUIT RADAR & MINIMAP (BOTTOM-RIGHT) -->
    <div class="absolute bottom-4 right-4 z-20 bg-gray-900/90 border-2 border-gray-800 p-1.5 rounded-lg shadow-xl backdrop-blur-md flex flex-col items-center">
        <canvas id="minimapCanvas" width="160" height="106" class="rounded border border-gray-800 bg-gray-950"></canvas>
        <span class="font-pixel text-[8px] text-yellow-400/80 mt-1 tracking-wider">CIRCUIT RADAR</span>
    </div>

    <!-- ZONE PROXIMITY NOTIFICATION BANNER -->
    <div id="zoneIndicator" class="absolute top-20 left-1/2 -translate-x-1/2 z-20 pointer-events-none transition-all duration-300 transform -translate-y-4 opacity-0">
        <div class="bg-gray-900/90 border-2 border-yellow-400 text-yellow-400 px-4 py-1.5 rounded-full shadow-2xl font-pixel text-[9px] flex items-center space-x-2">
            <i class="fa-solid fa-circle-dot text-red-500 animate-pulse"></i>
            <span id="zoneIndicatorText">PIT CREW READY - STOP TO ENTER</span>
        </div>
    </div>

    <!-- MAIN GAME CANVAS VIEWPORT -->
    <div class="relative w-full h-full">
        <canvas id="gameCanvas" class="block w-full h-full bg-green-950"></canvas>
    </div>

    <!-- PIT STOP CONTENT MODAL OVERLAY -->
    <div id="modalOverlay" class="fixed inset-0 z-40 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 transition-opacity duration-300 opacity-0 pointer-events-none">
        <div id="modalContainer" class="bg-gray-900 border-4 border-yellow-500 rounded-xl w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl transform scale-95 transition-transform duration-300 overflow-hidden">
            
            <!-- Modal Header -->
            <div class="bg-gray-800/90 px-6 py-4 border-b-2 border-gray-700 flex items-center justify-between">
                <div class="flex items-center space-x-3 text-yellow-400">
                    <i id="modalIcon" class="fa-solid fa-flag text-xl"></i>
                    <h2 id="modalTitle" class="font-pixel text-xs md:text-sm tracking-wide neon-glow-yellow">PIT STOP CONTENT</h2>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white font-pixel text-xs bg-gray-700 hover:bg-red-600 px-3 py-1.5 rounded transition">
                    ESC [X]
                </button>
            </div>

            <!-- Dynamic Modal Content Body -->
            <div id="modalBody" class="p-6 overflow-y-auto font-crt text-gray-200 space-y-4 custom-scrollbar">
                <!-- Injected via JavaScript -->
            </div>

            <!-- Modal Footer -->
            <div class="bg-gray-800/60 px-6 py-3 border-t border-gray-700 flex justify-between items-center text-xs font-pixel text-gray-400">
                <span>PRESS ESC OR BUTTON TO DRIVE OUT</span>
                <button onclick="closeModal()" class="bg-yellow-500 hover:bg-yellow-400 text-black px-4 py-2 rounded font-bold transition">
                    RESUME RACE
                </button>
            </div>
        </div>
    </div>

    <!-- Main Game Engine Logic Script -->
    <script src="game.js"></script>
</body>
</html>
