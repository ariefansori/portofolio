<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeneRally Retro Portfolio - Pit Stop Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Retro Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Press Start 2P & VT323 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Chakra+Petch:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Press Start 2P', cursive, monospace;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Chakra Petch', sans-serif;
        }

        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }

        .font-crt {
            font-family: 'VT323', monospace;
        }

        /* CRT Scanline Effect */
        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 40;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Custom Scrollbar for Retro Modals */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #ef4444;
            border-radius: 4px;
        }
    </style>
</head>
<body class="relative w-screen h-screen crt flex flex-col justify-between overflow-hidden text-white select-none">

    <!-- Top HUD / Navigation Header -->
    <header class="absolute top-0 left-0 right-0 z-30 flex flex-wrap items-center justify-between px-4 py-2 bg-slate-900/90 border-b-4 border-yellow-500 backdrop-blur-md shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-yellow-500 text-black font-pixel px-3 py-1 text-xs md:text-sm rounded tracking-wider shadow-inner font-bold flex items-center gap-2">
                <i class="fa-solid fa-flag-checkered"></i> GENERALLY PORTFOLIO
            </div>
            <div class="hidden sm:flex items-center text-xs font-pixel text-yellow-400 bg-black/60 px-2 py-1 rounded border border-yellow-500/30">
                <span class="animate-pulse mr-2 text-green-400">●</span> DRIVER: ASA
            </div>
        </div>

        <!-- Quick Teleport Navigation Buttons -->
        <nav class="flex items-center space-x-1 md:space-x-2 text-xs font-pixel">
            <button onclick="teleportToZone('about')" class="hover:bg-yellow-500 hover:text-black text-yellow-400 border border-yellow-500/50 px-2 py-1 md:px-3 md:py-1.5 rounded transition">
                <i class="fa-solid fa-user mr-1"></i><span class="hidden md:inline">ABOUT</span>
            </button>
            <button onclick="teleportToZone('projects')" class="hover:bg-blue-500 hover:text-black text-blue-400 border border-blue-500/50 px-2 py-1 md:px-3 md:py-1.5 rounded transition">
                <i class="fa-solid fa-code mr-1"></i><span class="hidden md:inline">PROJECTS</span>
            </button>
            <button onclick="teleportToZone('skills')" class="hover:bg-green-500 hover:text-black text-green-400 border border-green-500/50 px-2 py-1 md:px-3 md:py-1.5 rounded transition">
                <i class="fa-solid fa-microchip mr-1"></i><span class="hidden md:inline">SKILLS</span>
            </button>
            <button onclick="teleportToZone('contact')" class="hover:bg-red-500 hover:text-black text-red-400 border border-red-500/50 px-2 py-1 md:px-3 md:py-1.5 rounded transition">
                <i class="fa-solid fa-envelope mr-1"></i><span class="hidden md:inline">CONTACT</span>
            </button>
        </nav>

        <!-- HUD Controls Toggle -->
        <div class="flex items-center space-x-2 text-xs font-pixel">
            <button id="soundToggle" onclick="toggleSound()" class="bg-gray-800 border border-gray-600 px-2 py-1 rounded text-gray-300 hover:text-white">
                <i id="soundIcon" class="fa-solid fa-volume-xmark"></i>
            </button>
            <button id="crtToggle" onclick="toggleCRT()" class="bg-gray-800 border border-gray-600 px-2 py-1 rounded text-yellow-400 hover:text-white">
                CRT: ON
            </button>
        </div>
    </header>

    <!-- Main Racing Game Viewport -->
    <main class="relative w-full h-full bg-slate-950 flex items-center justify-center">
        <!-- Canvas Element -->
        <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>

        <!-- Speedometer & Lap Counter Overlay (Bottom Left) -->
        <div class="absolute bottom-4 left-4 z-20 pointer-events-none flex flex-col gap-2">
            <!-- Speedometer Panel -->
            <div class="bg-black/80 border-2 border-yellow-500 p-3 rounded-lg shadow-2xl flex items-center space-x-4 backdrop-blur">
                <div class="text-center">
                    <div class="text-[10px] font-pixel text-gray-400 mb-1">SPEED</div>
                    <div id="speedDisplay" class="font-pixel text-2xl md:text-3xl text-yellow-400 font-bold tracking-widest">000</div>
                    <div class="text-[10px] font-pixel text-gray-500">KM/H</div>
                </div>
                <div class="h-10 w-px bg-gray-700"></div>
                <div>
                    <div class="text-[10px] font-pixel text-gray-400 mb-1">LAP TIMER</div>
                    <div id="timerDisplay" class="font-pixel text-lg md:text-xl text-green-400">00:00.00</div>
                    <div id="bestLapDisplay" class="text-[10px] font-pixel text-yellow-500/80">BEST: --:--.--</div>
                </div>
            </div>

            <!-- Keyboard Hints -->
            <div class="hidden md:flex bg-black/70 border border-gray-700 p-2 rounded text-[10px] font-pixel text-gray-300 space-x-3 items-center">
                <span><kbd class="bg-gray-800 px-1.5 py-0.5 rounded border border-gray-600">W/↑</kbd> ACCEL</span>
                <span><kbd class="bg-gray-800 px-1.5 py-0.5 rounded border border-gray-600">S/↓</kbd> BRAKE</span>
                <span><kbd class="bg-gray-800 px-1.5 py-0.5 rounded border border-gray-600">A D/← →</kbd> STEER</span>
            </div>
        </div>

        <!-- Minimap Display (Bottom Right) -->
        <div class="absolute bottom-4 right-4 z-20 pointer-events-none hidden sm:block">
            <div class="bg-black/80 border-2 border-yellow-500 p-2 rounded-lg shadow-2xl backdrop-blur relative">
                <div class="text-[9px] font-pixel text-yellow-400 mb-1 text-center">MINIMAP</div>
                <canvas id="minimapCanvas" width="140" height="100" class="bg-slate-900 border border-gray-700 rounded"></canvas>
            </div>
        </div>

        <!-- Zone Enter Notification Bar (Top Middle) -->
        <div id="zoneIndicator" class="absolute top-16 left-1/2 -translate-x-1/2 z-20 transition-all duration-300 opacity-0 transform -translate-y-4 pointer-events-none">
            <div class="bg-black/90 border-2 border-yellow-400 text-yellow-400 font-pixel px-6 py-2.5 rounded-full shadow-2xl flex items-center space-x-3">
                <i class="fa-solid fa-wrench animate-spin text-yellow-400"></i>
                <span id="zoneIndicatorText" class="text-xs md:text-sm tracking-wider">PIT CREW READY - PULL IN TO SERVICE</span>
            </div>
        </div>

        <!-- Touch Controls Overlay for Mobile Devices -->
        <div class="absolute bottom-4 left-0 right-0 z-20 pointer-events-auto flex justify-between items-end px-6 md:hidden">
            <div class="flex space-x-3">
                <button id="btnLeft" class="w-14 h-14 bg-gray-800/80 active:bg-yellow-500 border-2 border-yellow-500 rounded-full flex items-center justify-center text-white text-xl active:text-black">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <button id="btnRight" class="w-14 h-14 bg-gray-800/80 active:bg-yellow-500 border-2 border-yellow-500 rounded-full flex items-center justify-center text-white text-xl active:text-black">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            <div class="flex space-x-3">
                <button id="btnBrake" class="w-14 h-14 bg-red-900/80 active:bg-red-500 border-2 border-red-500 rounded-full flex items-center justify-center text-white text-xl">
                    <i class="fa-solid fa-arrow-down"></i>
                </button>
                <button id="btnGas" class="w-16 h-16 bg-green-800/80 active:bg-green-500 border-2 border-green-500 rounded-full flex items-center justify-center text-white text-2xl">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Window Overlay for Content Sections -->
    <div id="modalOverlay" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div id="modalContainer" class="bg-gray-900 border-4 border-yellow-500 rounded-xl w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl transform scale-95 transition-all duration-300 overflow-hidden relative">
            
            <!-- Modal Header -->
            <div class="bg-gradient-to-r from-yellow-600 to-yellow-500 px-4 py-3 flex items-center justify-between border-b-4 border-yellow-700">
                <div class="flex items-center space-x-2 text-black font-pixel text-xs md:text-sm font-bold">
                    <i id="modalIcon" class="fa-solid fa-circle-info"></i>
                    <span id="modalTitle">PIT STOP - ABOUT ME</span>
                </div>
                <button onclick="closeModal()" class="bg-black/80 hover:bg-red-600 text-white font-pixel text-xs px-2.5 py-1 rounded border border-gray-600 transition">
                    ESC [X]
                </button>
            </div>

            <!-- Modal Content Scroll Body -->
            <div id="modalBody" class="p-6 overflow-y-auto font-crt text-lg text-gray-200 space-y-6">
                <!-- Content injected dynamically via JS -->
            </div>

            <!-- Modal Footer -->
            <div class="bg-gray-950 px-4 py-3 border-t border-gray-800 flex justify-between items-center text-xs font-pixel text-gray-400">
                <span>SERVICE COMPLETED - DRIVE OUT TO RESUME</span>
                <button onclick="closeModal()" class="bg-yellow-500 text-black hover:bg-yellow-400 font-pixel px-4 py-1.5 rounded font-bold transition">
                    LEAVE PIT
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. AUDIO SYNTHESIZER (RETRO ENGINE & TOOL SFX)
           ========================================================================== */
        let audioCtx = null;
        let soundEnabled = false;
        let engineOsc = null;
        let engineGain = null;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            engineOsc = audioCtx.createOscillator();
            engineGain = audioCtx.createGain();

            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0, audioCtx.currentTime);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(400, audioCtx.currentTime);

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function toggleSound() {
            if (!audioCtx) initAudio();
            soundEnabled = !soundEnabled;
            const soundIcon = document.getElementById('soundIcon');
            if (soundEnabled) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                soundIcon.className = "fa-solid fa-volume-high text-green-400";
            } else {
                if (engineGain) engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
                soundIcon.className = "fa-solid fa-volume-xmark text-gray-400";
            }
        }

        function updateEngineAudio(speedPercent) {
            if (!soundEnabled || !engineOsc) return;
            const pitch = 40 + (speedPercent * 160);
            const volume = 0.05 + (speedPercent * 0.1);
            engineOsc.frequency.setTargetAtTime(pitch, audioCtx.currentTime, 0.05);
            engineGain.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.05);
        }

        function playBeepSound(freq = 600, duration = 0.15) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playCrashSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playImpactPneumaticSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800 + Math.random() * 400, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function toggleCRT() {
            document.body.classList.toggle('crt');
            const btn = document.getElementById('crtToggle');
            btn.innerText = document.body.classList.contains('crt') ? 'CRT: ON' : 'CRT: OFF';
        }

        /* ==========================================================================
           2. CANVAS & WORLD CONFIGURATION
           ========================================================================== */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');

        // Adjusted WORLD bounds so the entire circuit is fully inside canvas boundaries
        const WORLD = { width: 2400, height: 1600 };

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const car = {
            x: 1050,
            y: 1200,
            angle: 0,
            speed: 0,
            maxSpeed: 7.5,
            reverseSpeed: -2.5,
            accel: 0.15,
            decel: 0.08,
            brake: 0.25,
            turnSpeed: 0.048,
            width: 22,
            height: 38,
            color: '#EDD139'
        };

        const keys = { up: false, down: false, left: false, right: false };
        let skidMarks = [];

        // Track Waypoints properly scaled to stay well inside 2400x1600
        const trackWaypoints = [
            { x: 1000, y: 1200 },
            { x: 1700, y: 1200 },
            { x: 2100, y: 950 },
            { x: 2100, y: 450 },
            { x: 1700, y: 250 },
            { x: 700, y: 250 },
            { x: 300, y: 450 },
            { x: 300, y: 950 },
            { x: 600, y: 1200 },
            { x: 1000, y: 1200 }
        ];

        /* ==========================================================================
           3. SECTIONS, BUILDINGS & OBSTACLES CONFIGURATION
           ========================================================================== */
        // Section locations updated to fit along the track within canvas
        const SECTIONS = [
            { id: 'about', title: 'ABOUT ME', x: 1200, y: 1050, color: '#eab308' },
            { id: 'projects', title: 'PROJECTS', x: 800, y: 150, color: '#3b82f6' },
            { id: 'skills', title: 'SKILLS', x: 2300, y: 700, color: '#22c55e' },
            { id: 'contact', title: 'CONTACT', x: 600, y: 1050, color: '#ef4444' }
        ];

        // Buildings (Represented as boxes with retro styling and collision)
        const BUILDINGS = [
            { x: 900, y: 500, w: 400, h: 400, name: "PORTFOLIO HQ", color: "#334155", accent: "#e2e8f0" },
            { x: 1300, y: 500, w: 300, h: 250, name: "SERVICE BAY", color: "#0f172a", accent: "#ef4444" },
            { x: 500, y: 500, w: 350, h: 200, name: "PADDOCK CLUB", color: "#1e293b", accent: "#f59e0b" },
            { x: 1600, y: 50, w: 300, h: 100, name: "GRANDSTAND A", color: "#1e293b", accent: "#3b82f6" },
            { x: 1250, y: 50, w: 300, h: 100, name: "GRANDSTAND B", color: "#1e293b", accent: "#3b82f6" },
            { x: 1600, y: 1400, w: 400, h: 150, name: "TUNING LAB", color: "#0f172a", accent: "#10b981" }
        ];

        // Obstacles (Tire stacks, Oil slicks, Cones)
        const OBSTACLES = [
            { type: 'tires', x: 1800, y: 700, r: 22 },
            { type: 'tires', x: 500, y: 400, r: 22 },
            { type: 'tires', x: 1350, y: 1320, r: 22 },
            { type: 'oil', x: 1200, y: 400, r: 75 },
            { type: 'oil', x: 150, y: 700, r: 65 },
            { type: 'cone', x: 1700, y: 1100, r: 12 },
            { type: 'cone', x: 1750, y: 1100, r: 12 },
            { type: 'cone', x: 1800, y: 1100, r: 12 },
            { type: 'cone', x: 1850, y: 1100, r: 12 },
            { type: 'cone', x: 1900, y: 1090, r: 12 },
            { type: 'cone', x: 1950, y: 1070, r: 12 },
            { type: 'cone', x: 1985, y: 1020, r: 12 },
            { type: 'cone', x: 2000, y: 970, r: 12 }
        ];

        let crewMembers = [];
        const CREW_SPEED = 0.6;

        function initCrew() {
            crewMembers = [];
            SECTIONS.forEach(sec => {
                const huddleOffsets = [
                    { x: 0, y: -25 },   // Front Nose
                    { x: -18, y: -10 },  // Front Left Tire
                    { x: -18, y: 10 },   // Rear Left Tire
                    { x: 18, y: -10 },   // Front Right Tire
                    { x: 18, y: 10 }    // Rear Right Tire
                ];

                huddleOffsets.forEach((off, idx) => {
                    crewMembers.push({
                        sectionId: sec.id,
                        roleIndex: idx,
                        homeX: sec.x + off.x,
                        homeY: sec.y + off.y,
                        x: sec.x + off.x,
                        y: sec.y + off.y,
                        targetX: sec.x + off.x,
                        targetY: sec.y + off.y,
                        color: sec.color,
                        animFrame: Math.random() * 10
                    });
                });
            });
        }
        initCrew();

        let activePitStop = null;
        let stopTimer = 0;
        const STOP_DURATION = 1.5;
        let isModalOpen = false;

        let lapStartTime = null;
        let currentLapTime = 0;
        let bestLapTime = null;
        const checkpointsPassed = new Set();

        /* ==========================================================================
           4. INPUT LISTENERS
           ========================================================================== */
        window.addEventListener('keydown', (e) => {
            if (isModalOpen) return;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        function bindTouchButton(id, keyName) {
            const btn = document.getElementById(id);
            if (!btn) return;
            const start = (e) => { e.preventDefault(); keys[keyName] = true; };
            const end = (e) => { e.preventDefault(); keys[keyName] = false; };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
        }

        bindTouchButton('btnGas', 'up');
        bindTouchButton('btnBrake', 'down');
        bindTouchButton('btnLeft', 'left');
        bindTouchButton('btnRight', 'right');

        /* ==========================================================================
           5. PHYSICS, COLLISIONS & PIT LOGIC
           ========================================================================== */
        function updatePhysics(dt) {
            if (isModalOpen) return;

            if (keys.up) {
                car.speed = Math.min(car.speed + car.accel, car.maxSpeed);
            } else if (keys.down) {
                car.speed = Math.max(car.speed - car.brake, car.reverseSpeed);
            } else {
                if (car.speed > 0) car.speed = Math.max(0, car.speed - car.decel);
                if (car.speed < 0) car.speed = Math.min(0, car.speed + car.decel);
            }

            if (Math.abs(car.speed) > 0.1) {
                const dir = car.speed > 0 ? 1 : -1;
                if (keys.left) car.angle -= car.turnSpeed * dir;
                if (keys.right) car.angle += car.turnSpeed * dir;
            }

            let nextX = car.x + Math.cos(car.angle) * car.speed;
            let nextY = car.y + Math.sin(car.angle) * car.speed;

            // --- Building Collision Detection (Box Colliders) ---
            BUILDINGS.forEach(b => {
                const margin = 18;
                if (nextX > b.x - margin && nextX < b.x + b.w + margin &&
                    nextY > b.y - margin && nextY < b.y + b.h + margin) {
                    
                    playCrashSound();
                    car.speed = -car.speed * 0.4; // Bounce back
                    nextX = car.x;
                    nextY = car.y;
                }
            });

            // --- Obstacle Collision Detection ---
            OBSTACLES.forEach(obs => {
                const dist = Math.hypot(nextX - obs.x, nextY - obs.y);
                if (dist < obs.r + 12) {
                    if (obs.type === 'tires' || obs.type === 'cone') {
                        playCrashSound();
                        car.speed = -car.speed * 0.5;
                        const angle = Math.atan2(nextY - obs.y, nextX - obs.x);
                        nextX = obs.x + Math.cos(angle) * (obs.r + 14);
                        nextY = obs.y + Math.sin(angle) * (obs.r + 14);
                    } else if (obs.type === 'oil') {
                        // Slippery oil effect
                        car.angle += (Math.random() - 0.5) * 0.3;
                        car.speed *= 0.96;
                    }
                }
            });

            if (Math.abs(car.speed) > 4 && (keys.left || keys.right || keys.down)) {
                skidMarks.push({
                    x1: car.x,
                    y1: car.y,
                    x2: nextX,
                    y2: nextY,
                    alpha: 0.6
                });
                if (skidMarks.length > 150) skidMarks.shift();
            }

            skidMarks.forEach(sm => sm.alpha -= 0.001);
            skidMarks = skidMarks.filter(sm => sm.alpha > 0);

            car.x = nextX;
            car.y = nextY;

            // Keep inside World Canvas boundaries safely
            car.x = Math.max(50, Math.min(WORLD.width - 50, car.x));
            car.y = Math.max(50, Math.min(WORLD.height - 50, car.y));

            updateEngineAudio(Math.abs(car.speed) / car.maxSpeed);
            document.getElementById('speedDisplay').innerText = Math.round(Math.abs(car.speed) * 18).toString().padStart(3, '0');

            checkPitProximity(dt);
            updateLapTimer();
        }

        function checkPitProximity(dt) {
            let nearSection = null;

            SECTIONS.forEach(sec => {
                const dist = Math.hypot(car.x - sec.x, car.y - sec.y);
                if (dist < 110) {
                    nearSection = sec;
                }
            });

            const indicator = document.getElementById('zoneIndicator');

            if (nearSection) {
                activePitStop = nearSection;
                document.getElementById('zoneIndicatorText').innerText = `PIT CREW SERVICING ${nearSection.title}`;
                indicator.classList.remove('opacity-0', '-translate-y-4');

                if (Math.abs(car.speed) < 1.2) {
                    stopTimer += dt;
                    if (stopTimer >= STOP_DURATION && !isModalOpen) {
                        openModal(nearSection.id);
                    }
                } else {
                    stopTimer = Math.max(0, stopTimer - dt * 2);
                }
            } else {
                activePitStop = null;
                stopTimer = 0;
                indicator.classList.add('opacity-0', '-translate-y-4');
            }

            crewMembers.forEach(c => {
                c.animFrame += 0.08;
                if (activePitStop && activePitStop.id === c.sectionId) {
                    const cos = Math.cos(car.angle);
                    const sin = Math.sin(car.angle);

                    let offX = 0, offY = 0;
                    if (c.roleIndex === 0) { offX = 24; offY = 0; }
                    else if (c.roleIndex === 1) { offX = 10; offY = -18; }
                    else if (c.roleIndex === 2) { offX = -10; offY = -18; }
                    else if (c.roleIndex === 3) { offX = 10; offY = 18; }
                    else if (c.roleIndex === 4) { offX = -10; offY = 18; }

                    c.targetX = car.x + (offX * cos - offY * sin);
                    c.targetY = car.y + (offX * sin + offY * cos);
                } else {
                    c.targetX = c.homeX;
                    c.targetY = c.homeY;
                }

                c.x += (c.targetX - c.x) * (CREW_SPEED * 0.08);
                c.y += (c.targetY - c.y) * (CREW_SPEED * 0.08);
            });
        }

        /* ==========================================================================
           6. RENDER FUNCTIONS
           ========================================================================== */
        function drawBuildings() {
            BUILDINGS.forEach(b => {
                ctx.save();
                // Building Drop Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(b.x + 12, b.y + 12, b.w, b.h);

                // Building Main Body (Box)
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);

                // Roof Border / Parapet
                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 4;
                ctx.strokeRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);

                // Roof Accent Stripe
                ctx.fillStyle = b.accent;
                ctx.fillRect(b.x + 8, b.y + 8, b.w - 16, 8);

                // Roof Label
                ctx.fillStyle = '#ffffff';
                ctx.font = '10px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText(b.name, b.x + b.w / 2, b.y + b.h / 2 + 4);

                ctx.restore();
            });
        }

        function drawObstacles() {
            OBSTACLES.forEach(obs => {
                ctx.save();
                if (obs.type === 'tires') {
                    // Tire Stack
                    ctx.fillStyle = '#111827';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    ctx.fillStyle = '#374151';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.r * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                } else if (obs.type === 'oil') {
                    // Oil Slick
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
                    ctx.beginPath();
                    ctx.ellipse(obs.x, obs.y, obs.r, obs.r * 0.7, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                } else if (obs.type === 'cone') {
                    // Traffic Cone
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.r * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        function drawTrack() {
            // Grass
            ctx.fillStyle = '#2d8a4e';
            ctx.fillRect(0, 0, WORLD.width, WORLD.height);

            // Draw Buildings & Turf detail
            drawBuildings();

            // Track Asphalt Base
            ctx.strokeStyle = '#3a3a3a';
            ctx.lineWidth = 140;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(1000, 1200);
            ctx.lineTo(1700, 1200);
            ctx.arcTo(2100, 1200, 2100, 950, 250);
            ctx.lineTo(2100, 450);
            ctx.arcTo(2100, 250, 1700, 250, 250);
            ctx.lineTo(700, 250);
            ctx.arcTo(300, 250, 300, 450, 250);
            ctx.lineTo(300, 950);
            ctx.arcTo(300, 1200, 600, 1200, 250);
            ctx.lineTo(1000, 1200);
            ctx.closePath();
            ctx.stroke();

            // Track Inner Lane Line
            ctx.strokeStyle = '#555555';
            ctx.lineWidth = 120;
            ctx.stroke();

            // Checkered Finish Line
            ctx.save();
            ctx.translate(1050, 1200);
            ctx.fillStyle = '#ffffff';
            for (let i = -60; i < 60; i += 20) {
                for (let j = -10; j < 10; j += 10) {
                    if ((i / 20 + j / 10) % 2 === 0) {
                        ctx.fillRect(j, i, 10, 10);
                    }
                }
            }
            ctx.restore();

            // Pit Stop Sponsors
            SECTIONS.forEach(sec => {
                ctx.save();
                ctx.translate(sec.x, sec.y - 65);

                ctx.fillStyle = '#111111';
                ctx.fillRect(-60, 0, 6, 25);
                ctx.fillRect(54, 0, 6, 25);

                ctx.fillStyle = '#222222';
                ctx.fillRect(-70, -40, 140, 42);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-66, -36, 132, 34);

                ctx.fillStyle = sec.color;
                ctx.fillRect(-66, -36, 132, 10);

                ctx.fillStyle = '#000000';
                ctx.font = '9px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText(sec.title, 0, -10);

                ctx.fillStyle = '#666666';
                ctx.font = '6px "Press Start 2P"';
                ctx.fillText('SPONSOR • PIT ZONE', 0, -29);

                ctx.restore();
            });

            // Draw Obstacles on Track
            drawObstacles();

            // Draw Pit Crew Members
            crewMembers.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y);

                const walkCycle = Math.sin(c.animFrame) * 2;

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, 4, 7, 3.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.arc(0, walkCycle, 5.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.arc(0, -2 + walkCycle, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#facc15';
                ctx.fillRect(-2, -4 + walkCycle, 4, 1.2);

                if (activePitStop && activePitStop.id === c.sectionId && stopTimer > 0) {
                    if (Math.random() > 0.4) {
                        ctx.fillStyle = '#fef08a';
                        ctx.fillRect((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, 2, 2);
                        if (Math.random() > 0.7) playImpactPneumaticSound();
                    }
                }

                ctx.restore();
            });
        }

        function drawSkidMarks() {
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 3;
            skidMarks.forEach(sm => {
                ctx.globalAlpha = sm.alpha;
                ctx.beginPath();
                ctx.moveTo(sm.x1, sm.y1);
                ctx.lineTo(sm.x2, sm.y2);
                ctx.stroke();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle + Math.PI / 2);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(-car.width / 2 + 3, -car.height / 2 + 3, car.width, car.height);

            ctx.fillStyle = car.color;
            ctx.beginPath();
            ctx.roundRect(-car.width / 2, -car.height / 2, car.width, car.height, 5);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-car.width / 2 + 3, -car.height / 4, car.width - 6, car.height / 2.2);

            ctx.fillStyle = '#fef08a';
            ctx.fillRect(-car.width / 2 + 2, -car.height / 2 - 2, 4, 3);
            ctx.fillRect(car.width / 2 - 6, -car.height / 2 - 2, 4, 3);

            ctx.fillStyle = keys.down ? '#ff0000' : '#991b1b';
            ctx.fillRect(-car.width / 2 + 2, car.height / 2 - 1, 5, 3);
            ctx.fillRect(car.width / 2 - 7, car.height / 2 - 1, 5, 3);

            ctx.fillStyle = '#111827';
            ctx.fillRect(-car.width / 2 - 1, car.height / 2 - 4, car.width + 2, 4);

            ctx.restore();

            if (activePitStop && stopTimer > 0) {
                const progress = Math.min(stopTimer / STOP_DURATION, 1);
                ctx.save();
                ctx.beginPath();
                ctx.arc(car.x, car.y, 38, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * progress));
                ctx.lineWidth = 5;
                ctx.strokeStyle = activePitStop.color;
                ctx.stroke();

                ctx.font = '8px "Press Start 2P"';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText("SERVICING...", car.x, car.y - 45);
                ctx.restore();
            }
        }

            const mins = Math.floor(currentLapTime / 60).toString().padStart(2, '0');
            const secs = Math.floor(currentLapTime % 60).toString().padStart(2, '0');
            const ms = Math.floor((currentLapTime % 1) * 100).toString().padStart(2, '0');

            document.getElementById('timerDisplay').innerText = `${mins}:${secs}.${ms}`;

            if (Math.hypot(car.x - 1050, car.y - 1200) < 60 && checkpointsPassed.size >= 3) {
                if (!bestLapTime || currentLapTime < bestLapTime) {
                    bestLapTime = currentLapTime;
                    const bMins = Math.floor(bestLapTime / 60).toString().padStart(2, '0');
                    const bSecs = Math.floor(bestLapTime % 60).toString().padStart(2, '0');
                    const bMs = Math.floor((bestLapTime % 1) * 100).toString().padStart(2, '0');
                    document.getElementById('bestLapDisplay').innerText = `BEST: ${bMins}:${bSecs}.${bMs}`;
                }
                lapStartTime = performance.now();
                checkpointsPassed.clear();
            }

            SECTIONS.forEach((s, idx) => {
                if (Math.hypot(car.x - s.x, car.y - s.y) < 150) {
                    checkpointsPassed.add(idx);
                }
            });
        }

        function drawMinimap() {
            const scaleX = minimapCanvas.width / WORLD.width;
            const scaleY = minimapCanvas.height / WORLD.height;

            minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);

            // Buildings on minimap
            minimapCtx.fillStyle = '#475569';
            BUILDINGS.forEach(b => {
                minimapCtx.fillRect(b.x * scaleX, b.y * scaleY, b.w * scaleX, b.h * scaleY);
            });

            // Track waypoints line
            minimapCtx.strokeStyle = '#94a3b8';
            minimapCtx.lineWidth = 5;
            minimapCtx.beginPath();
            trackWaypoints.forEach((pt, i) => {
                if (i === 0) minimapCtx.moveTo(pt.x * scaleX, pt.y * scaleY);
                else minimapCtx.lineTo(pt.x * scaleX, pt.y * scaleY);
            });
            minimapCtx.stroke();

            // Sections / Pit stops
            SECTIONS.forEach(s => {
                minimapCtx.fillStyle = s.color;
                minimapCtx.beginPath();
                minimapCtx.arc(s.x * scaleX, s.y * scaleY, 3, 0, Math.PI * 2);
                minimapCtx.fill();
            });

            // Car Blip
            minimapCtx.fillStyle = '#ffffff';
            minimapCtx.beginPath();
            minimapCtx.arc(car.x * scaleX, car.y * scaleY, 3.5, 0, Math.PI * 2);
            minimapCtx.fill();
        }

        let lastTime = performance.now();

        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            updatePhysics(dt);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 - car.x, canvas.height / 2 - car.y);

            drawTrack();
            drawSkidMarks();
            drawCar();

            ctx.restore();

            drawMinimap();

            requestAnimationFrame(gameLoop);
        }

        window.onload = function() {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
